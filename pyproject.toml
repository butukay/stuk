[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stuk"
version = "0.1.0"
description = "Minimal terminal typing practice in Russian and English."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Environment :: Console :: Curses",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["ruff"]

[project.scripts]
stuk = "stuk.cli:main"

[project.urls]
Repository = "https://github.com/butukay/stuk"
Issues = "https://github.com/butukay/stuk/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
